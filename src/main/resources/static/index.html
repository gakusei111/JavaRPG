<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Java RPG - Hybrid Edition</title>
    <style>
        /* === 基本設定（ダークテーマ） === */
        body { 
            background-color: #202028; 
            color: #fff; 
            font-family: 'Verdana', sans-serif; 
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            transition: all 0.5s ease;
        }

        body.battle-mode {
            display: block;
            padding: 40px;
            overflow-y: auto;
            height: auto;
            text-align: center;
        }

        /* === セットアップ用のカードデザイン === */
        .stage-card {
            background: #2d2d38;
            border: 2px solid #555;
            border-radius: 12px;
            width: 400px;
            padding: 40px;
            box-shadow: 0 15px 30px rgba(0,0,0,0.6);
            display: none;
            animation: slideIn 0.5s ease;
        }
        .active { display: block; }

        h2 { color: #ffcc00; margin-bottom: 20px; }
        p { color: #aaa; margin-bottom: 30px; }
        label { display: block; text-align: left; margin-bottom: 8px; font-weight: bold; }
        
        input, select {
            width: 100%; padding: 12px; margin-bottom: 25px;
            background: #111; color: #fff; border: 1px solid #444; border-radius: 6px;
            font-size: 16px; box-sizing: border-box;
        }

        button {
            background-color: #007bff; color: white; border: none;
            padding: 15px 0; width: 100%; font-size: 18px;
            border-radius: 6px; cursor: pointer; transition: 0.2s;
        }
        button:hover { background-color: #0056b3; }
        .btn-battle { background-color: #d62828; }
        .btn-battle:hover { background-color: #a01d1d; }

        /* === ステージ4（戦闘画面）のデザイン === */
        #stage-4 {
            display: none;
            max-width: 800px;
            margin: 0 auto;
        }

        #log-window {
            background: #000;
            border: 4px double #fff;
            border-radius: 8px;
            height: 200px;
            padding: 20px;
            overflow-y: scroll;
            text-align: left;
            font-family: 'Courier New', monospace;
            box-shadow: 0 0 15px rgba(0, 255, 0, 0.2);
            margin-bottom: 30px;
        }
        .log-entry { margin-bottom: 5px; border-bottom: 1px dashed #333; }

        #history-section {
            background: #2d2d38;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #444;
            text-align: left;
        }
        #history-list { list-style: none; padding: 0; }
        #history-list li { padding: 10px; border-bottom: 1px solid #444; }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* === バトルビュー（画像表示エリア） === */
        #battle-view {
            background: #1a1a1a;
            border: 2px solid #444;
            border-radius: 8px;
            margin-bottom: 20px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 30px;
        }

        .enemy-side img {
            width: 160px;
            height: 160px;
            image-rendering: pixelated;
        }

        .player-side {
            display: flex;
            justify-content: space-around;
            width: 100%;
        }

        .char-box { text-align: center; font-size: 12px; color: #aaa; }
        .char-box img {
            width: 100px;
            height: 100px;
            image-rendering: pixelated;
        }

        /* === ステータス表示用のデザイン === */
        .status-box {
            text-align: left;
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid #555;
            border-radius: 4px;
            padding: 5px 8px;
            margin-top: 5px;
            font-size: 11px;
            color: #ddd;
            line-height: 1.4;
            font-family: monospace;
        }
        .status-name {
            margin: 5px 0;
            font-weight: bold;
            color: #fff;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div id="stage-0" class="stage-card active">
        <h2>モード選択</h2>
        <p>プレイするモードを選択してください。</p>
        
        <button onclick="selectMode('story')" style="margin-bottom: 20px; background-color: #28a745;">ストーリーモード</button>
        <button onclick="selectMode('annihilation')" style="background-color: #dc3545;">殲滅モード</button>
    </div>

    <div id="stage-1" class="stage-card" style="display: none;">
        <h2>キャラクター作成</h2>
        <p>あなたの分身となる英雄を作成します。</p>
        
        <label>名前 <span style="font-size:12px; color:#888;">(1〜12文字)</span></label>
        <input type="text" id="heroName" value="" placeholder="名前を入力">
        
        <p id="error-message" style="color: #ff4444; font-weight: bold; display: none; margin-top: -15px; margin-bottom: 15px;"></p>

        <label>役職</label>
        <select id="heroJob">
            <option value="Swordsman">剣士</option>
            <option value="Mage">魔法使い</option>
            <option value="Healer">ヒーラー</option>
            <option value="Knight">騎士</option>
        </select>
        
        <button onclick="validateHeroName()">次へ ➡</button>
    </div>

    <div id="stage-2" class="stage-card">
        <h2>仲間を選択 (1/2)</h2>
        <p>一人目の仲間を選んでください。</p>
        <label>仲間Aの役職</label>
        <select id="job2">
            <option value="Swordsman">剣士</option>
            <option value="Mage" selected>魔法使い</option>
            <option value="Healer">ヒーラー</option>
            <option value="Knight">騎士</option>
        </select>
        <button onclick="nextStage(2, 3)">次へ ➡</button>
    </div>

    <div id="stage-3" class="stage-card">
        <h2>仲間を選択 (2/2)</h2>
        <p>二人目の仲間を選んでください。</p>
        <label>仲間Bの役職</label>
        <select id="job3">
            <option value="Swordsman">剣士</option>
            <option value="Mage">魔法使い</option>
            <option value="Healer" selected>ヒーラー</option>
            <option value="Knight">騎士</option>
        </select>
        <button onclick="nextStage(3, 'type-select')">次へ</button>
    </div>

    <div id="stage-type-select" class="stage-card">
        <h2>戦闘形式を選択</h2>
        <p>殲滅モードの形式を選んでください。</p>
        <button onclick="selectAnnihilationType('single')" style="margin-bottom: 20px; background-color: #007bff;">単体戦</button>
        <button onclick="selectAnnihilationType('consecutive')" style="background-color: #6f42c1;">連戦</button>
    </div>

    <div id="stage-4">
        <h1 style="text-shadow: 2px 2px #000;">Battle Log</h1>
        
        <div id="battle-view">
            <div class="enemy-side">
                <img id="enemy-img" src="" alt="Enemy">
                <p id="enemy-name" class="status-name" style="font-size: 16px;">-</p>
                <div class="status-box" style="display: inline-block; text-align: center;">
                    HP: <span id="enemy-hp">-</span> / <span id="enemy-maxhp">-</span><br>
                    ATK: <span id="enemy-atk">-</span>
                </div>
            </div>
            
            <div class="player-side">
                <div class="char-box">
                    <img id="hero-img" src="" alt="Hero">
                    <p id="hero-name" class="status-name">主人公</p>
                    <div class="status-box">
                        HP: <span id="hero-hp">-</span> / <span id="hero-maxhp">-</span><br>
                        MP: <span id="hero-mp">-</span> / <span id="hero-maxmp">-</span><br>
                        ATK: <span id="hero-atk">-</span>
                    </div>
                </div>
                <div class="char-box">
                    <img id="memberA-img" src="" alt="Member A">
                    <p id="memberA-name" class="status-name">仲間A</p>
                    <div class="status-box">
                        HP: <span id="memberA-hp">-</span> / <span id="memberA-maxhp">-</span><br>
                        MP: <span id="memberA-mp">-</span> / <span id="memberA-maxmp">-</span><br>
                        ATK: <span id="memberA-atk">-</span>
                    </div>
                </div>
                <div class="char-box">
                    <img id="memberB-img" src="" alt="Member B">
                    <p id="memberB-name" class="status-name">仲間B</p>
                    <div class="status-box">
                        HP: <span id="memberB-hp">-</span> / <span id="memberB-maxhp">-</span><br>
                        MP: <span id="memberB-mp">-</span> / <span id="memberB-maxmp">-</span><br>
                        ATK: <span id="memberB-atk">-</span>
                    </div>
                </div>
            </div>
        </div>

        <div id="log-window">
            <div class="log-entry">パーティーを編成中...</div>
        </div>

        <div id="command-panel" style="display: none; margin-bottom: 20px;">
            <div id="command-target-name" style="font-weight:bold; color:#ffcc00; margin-bottom:10px;">-</div>
            <button onclick="registerCommand('attack')" style="width: 48%; display: inline-block;">通常攻撃</button>
            <button onclick="registerCommand('skill')" style="width: 48%; display: inline-block; background-color: #ff9900;">職業スキル</button>
        </div>

        <div id="result-actions" style="display: none; margin-bottom: 20px;">
            <button onclick="restartSameParty()" style="width: 48%; display: inline-block; background-color: #28a745;">もう一度遊ぶ</button>
            <button onclick="location.reload()" style="width: 48%; display: inline-block; background-color: #dc3545;">最初から遊ぶ</button>
        </div>

        <hr style="margin: 40px 0; border-color: #444;">
        
        <div id="history-section">
            <div style="display:flex; justify-content:space-between; align-items:center;">
                <h2 style="margin:0;">過去の戦績</h2>
                <button onclick="loadHistory()" style="width: auto; padding: 5px 20px; font-size: 14px;">履歴を更新</button>
            </div>
            <ul id="history-list"></ul>
        </div>
    </div>

    <script>
// --- ゲーム進行用ステート ---
        let currentGameMode = ""; // 'story' または 'annihilation'
        let currentAnnihilationType = ""; // 'single' または 'consecutive'
        let currentPartyStatus = [];
        let pendingCommands = [];
        let currentInputIndex = 0;

        /**
         * モード選択処理
         */
        function selectMode(mode) {
            currentGameMode = mode;
            
            if (mode === 'story') {
                alert("ストーリーモードは現在開発中です。");
                return;
            }

            // 殲滅モードが選ばれた場合、ステージ1へ進む
            document.getElementById('stage-0').classList.remove('active');
            document.getElementById('stage-0').style.display = 'none';
            
            const nextEl = document.getElementById('stage-1');
            nextEl.style.display = 'block';
            nextEl.classList.add('active');
        }

        /**
         * 殲滅モードの戦闘形式（単体/連戦）選択処理
         */
        function selectAnnihilationType(type) {
            currentAnnihilationType = type;

            if (type === 'consecutive') {
                alert("連戦モードは次回開発予定です。");
                return;
            }

            // 単体戦が選ばれた場合は戦闘開始処理へ進む
            startAdventure();
        }

        /**
         * 名前のバリデーション
         */
        function validateHeroName() {
            const nameInput = document.getElementById('heroName');
            const name = nameInput.value.trim();
            const errorMsg = document.getElementById('error-message');

            if (name.length === 0) {
                errorMsg.innerText = "名前を入力してください。";
                errorMsg.style.display = 'block';
                nameInput.style.borderColor = "#ff4444";
                return;
            }

            if (name.length > 12) {
                errorMsg.innerText = "名前は12文字以内で入力してください。";
                errorMsg.style.display = 'block';
                nameInput.style.borderColor = "#ff4444";
                return;
            }

            errorMsg.style.display = 'none';
            nameInput.style.borderColor = "#444";
            nextStage(1, 2);
        }

        /**
         * ステージ切り替え
         */
        function nextStage(current, next) {
            document.getElementById('stage-' + current).classList.remove('active');
            document.getElementById('stage-' + current).style.display = 'none';
            
            const nextEl = document.getElementById('stage-' + next);
            nextEl.style.display = 'block';
            nextEl.classList.add('active');
        }

        /**
         * 冒険開始（初期化）処理
         */
        async function startAdventure() {
            document.body.classList.add('battle-mode');
            // 変更：非表示にする対象を stage-3 から stage-type-select に変更
            document.getElementById('stage-type-select').style.display = 'none';
            document.getElementById('stage-4').style.display = 'block';

            // ...（以降の startAdventure 関数の内容は変更なし）

            const name = document.getElementById('heroName').value;
            const job1 = document.getElementById('heroJob').value;
            const job2 = document.getElementById('job2').value;
            const job3 = document.getElementById('job3').value;
            const logWindow = document.getElementById('log-window');

            logWindow.innerHTML = `<div class="log-entry" style="color:#ffff00">パーティー結成: ${name}(${job1}), 仲間A(${job2}), 仲間B(${job3})</div>`;

            try {
                const response = await fetch(`/api/battle/init?name=${name}&job1=${job1}&job2=${job2}&job3=${job3}`);
                const data = await response.json();

                updateStatus(data.partyStatus, data.enemyStatus);

                document.getElementById('enemy-img').src = `/images/enemy_${data.enemyKey}.png`;
                document.getElementById('hero-img').src = `/images/player_${data.heroKey.toLowerCase()}.png`;
                document.getElementById('memberA-img').src = `/images/player_${data.memberAKey.toLowerCase()}.png`;
                document.getElementById('memberB-img').src = `/images/player_${data.memberBKey.toLowerCase()}.png`;

                currentPartyStatus = data.partyStatus;
                appendLogs(data.logs);
                startCommandInput();

            } catch (e) {
                console.error("Initialization failed:", e);
                logWindow.innerHTML += `<div style="color:red">エラー: 通信に失敗しました。サーバーが起動しているか確認してください。</div>`;
            }
        }

        /**
         * 同一パーティーでの戦闘再開処理
         */
        async function restartSameParty() {
            document.getElementById('result-actions').style.display = 'none';
            const logWindow = document.getElementById('log-window');
            
            logWindow.innerHTML = '<div class="log-entry" style="color:#aaaaaa;">新しい戦闘を準備中...</div>';

            try {
                const response = await fetch('/api/battle/restart');
                const data = await response.json();

                updateStatus(data.partyStatus, data.enemyStatus);
                document.getElementById('enemy-img').src = `/images/enemy_${data.enemyKey}.png`;

                currentPartyStatus = data.partyStatus;
                appendLogs(data.logs);
                setTimeout(() => {
                    startCommandInput();
                }, data.logs.length * 100);

            } catch (e) {
                console.error("Failed to restart battle.", e);
                logWindow.innerHTML += `<div style="color:red">通信エラーが発生しました。サーバーの状態を確認してください。</div>`;
            }
        }

        /**
         * コマンド入力の開始
         */
        function startCommandInput() {
            pendingCommands = [];
            currentInputIndex = 0;
            askNextCommand();
        }

        /**
         * 順番にコマンドを要求する
         */
        function askNextCommand() {
            while (currentInputIndex < 3 && currentPartyStatus[currentInputIndex].hp <= 0) {
                pendingCommands.push('attack');
                currentInputIndex++;
            }

            if (currentInputIndex >= 3) {
                executeBatchCommands();
            } else {
                document.getElementById('command-target-name').innerText = currentPartyStatus[currentInputIndex].name + " の行動を選択";
                document.getElementById('command-panel').style.display = 'block';
            }
        }

        /**
         * コマンドの記録
         */
        function registerCommand(action) {
            document.getElementById('command-panel').style.display = 'none';
            pendingCommands.push(action);
            currentInputIndex++;
            askNextCommand();
        }

        /**
         * ターン実行（バッチ送信）
         */
        async function executeBatchCommands() {
            const query = `actions=${pendingCommands.join(',')}`;
            try {
                const response = await fetch(`/api/battle/command?${query}`);
                const data = await response.json(); 

                updateStatus(data.partyStatus, data.enemyStatus);
                currentPartyStatus = data.partyStatus; 
                appendLogs(data.logs);

                if (data.isGameOver) {
                    document.getElementById('result-actions').style.display = 'block';
                    setTimeout(loadHistory, data.logs.length * 100 + 500);
                } else {
                    setTimeout(() => {
                        startCommandInput();
                    }, data.logs.length * 100);
                }
            } catch (e) {
                console.error("通信エラー", e);
            }
        }

        /**
         * ログ描画
         */
        function appendLogs(logs) {
            const logWindow = document.getElementById('log-window');
            logs.forEach((log, i) => {
                setTimeout(() => {
                    const div = document.createElement('div');
                    div.className = 'log-entry';
                    div.innerText = log;
                    logWindow.appendChild(div);
                    logWindow.scrollTop = logWindow.scrollHeight;
                }, i * 100);
            });
        }

        /**
         * ステータスUIの更新
         */
        function updateStatus(partyStatus, enemyStatus) {
            if (partyStatus && partyStatus.length >= 3) {
                document.getElementById('hero-name').innerText = partyStatus[0].name;
                document.getElementById('hero-hp').innerText = partyStatus[0].hp;
                document.getElementById('hero-maxhp').innerText = partyStatus[0].maxHp;
                document.getElementById('hero-mp').innerText = partyStatus[0].mp;
                document.getElementById('hero-maxmp').innerText = partyStatus[0].maxMp;
                document.getElementById('hero-atk').innerText = partyStatus[0].attackPower;

                document.getElementById('memberA-name').innerText = partyStatus[1].name;
                document.getElementById('memberA-hp').innerText = partyStatus[1].hp;
                document.getElementById('memberA-maxhp').innerText = partyStatus[1].maxHp;
                document.getElementById('memberA-mp').innerText = partyStatus[1].mp;
                document.getElementById('memberA-maxmp').innerText = partyStatus[1].maxMp;
                document.getElementById('memberA-atk').innerText = partyStatus[1].attackPower;

                document.getElementById('memberB-name').innerText = partyStatus[2].name;
                document.getElementById('memberB-hp').innerText = partyStatus[2].hp;
                document.getElementById('memberB-maxhp').innerText = partyStatus[2].maxHp;
                document.getElementById('memberB-mp').innerText = partyStatus[2].mp;
                document.getElementById('memberB-maxmp').innerText = partyStatus[2].maxMp;
                document.getElementById('memberB-atk').innerText = partyStatus[2].attackPower;
            }

            if (enemyStatus) {
                document.getElementById('enemy-name').innerText = enemyStatus.name;
                document.getElementById('enemy-hp').innerText = enemyStatus.hp;
                document.getElementById('enemy-maxhp').innerText = enemyStatus.maxHp;
                document.getElementById('enemy-atk').innerText = enemyStatus.attackPower;
            }
        }

        /**
         * 履歴読み込み
         */
        async function loadHistory() {
            const list = document.getElementById('history-list');
            list.innerHTML = "<li style='color:#888'>読み込み中...</li>";

            try {
                const response = await fetch('/api/history');
                const history = await response.json();
                list.innerHTML = "";

                history.reverse().slice(0, 5).forEach(item => {
                    const li = document.createElement('li');
                    const date = new Date(item.createdAt).toLocaleString();
                    const isWin = item.winner !== item.enemyName;
                    
                    li.innerHTML = `
                        <span style="font-size:12px; color:#888;">[${date}]</span><br>
                        <strong>${item.enemyName}</strong> との戦闘 
                        → <span style="color: ${isWin ? '#00ff00' : '#ff4500'}">勝者: ${item.winner}</span>
                    `;
                    list.appendChild(li);
                });

                if (history.length === 0) list.innerHTML = "<li>まだ戦績はありません。</li>";

            } catch (e) {
                list.innerHTML = "<li>履歴の取得に失敗しました。</li>";
            }
        }
    </script>
</body>
</html>
